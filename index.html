
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>zenturfpronos  – Beaumont de Lomagne (14/09/2026)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #0ea5e9;
      --primary-dark: #0284c7;
      --accent: #f59e0b;
      --success: #16a34a;
      --danger: #dc2626;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: linear-gradient(135deg, var(--primary), #6366f1);
      color: #fff;
      padding: 20px 14px;
      text-align: center;
    }
    header h1 {
      margin: 0 0 6px;
      font-size: 1.4rem;
    }
    header p {
      margin: 0;
      opacity: 0.95;
      font-size: 0.9rem;
    }
    .container {
      max-width: 900px;
      margin: 14px auto 40px;
      padding: 0 12px;
    }
    .race-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 14px;
      overflow: hidden;
    }
    .race-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: #f1f5f9;
      cursor: pointer;
      user-select: none;
    }
    .race-title {
      font-weight: 700;
      font-size: 1rem;
    }
    .race-sub {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .race-body {
      display: none;
      padding: 14px;
      border-top: 1px solid var(--border);
    }
    .race-card.open .race-body {
      display: block;
    }
    .section-title {
      font-weight: 700;
      color: var(--primary-dark);
      margin: 12px 0 8px;
      font-size: 0.95rem;
    }
    .top5-list, .combo-list {
      list-style: none;
      padding: 0;
      margin: 0 0 12px;
    }
    .top5-item {
      display: grid;
      grid-template-columns: 40px 1fr 60px;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 6px;
      background: #fafafa;
    }
    .rank {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: #e0f2fe;
      color: #0369a1;
      font-weight: 700;
      font-size: 0.8rem;
    }
    .horse-name {
      font-weight: 600;
      font-size: 0.92rem;
    }
    .horse-meta {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .strength {
      text-align: right;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--primary-dark);
    }
    .base-surprise {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .box {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: #fafafa;
    }
    .box strong {
      display: block;
      margin-bottom: 4px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .box .value {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .base .value { color: var(--success); }
    .surprise .value { color: var(--danger); }
    .combo-title {
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: var(--primary-dark);
    }
    .combo-list li {
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 6px;
      background: #fff;
      font-size: 0.9rem;
    }
    .disclaimer {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 10px;
      text-align: center;
    }
    @media (max-width: 480px) {
      header h1 { font-size: 1.2rem; }
      .race-title { font-size: 0.95rem; }
      .top5-item { grid-template-columns: 34px 1fr 50px; }
      .base-surprise { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>ZEturf Pronos – Beaumont de Lomagne</h1>
    <p>تحليل 6 سباقات – 14/09/2026</p>
  </header>

  <div class="container" id="app">
    <!-- سيتم ملء البطاقات بواسطة JavaScript -->
  </div>

  <p class="disclaimer">
    هذه التحليلات مستوحاة من اختيارات ZEturf وCanalturf للسباقات، وليست ضمانًا للفوز. استعملها كأساس لتحليلك الخاص. [17][21][23]
  </p>

  <script>
    // بيانات 6 سباقات مستخرجة من ZEturf / Canalturf لـ Beaumont de Lomagne
    const races = [
      {
        id: "R1C1",
        name: "Grand Prix Jean Dumouch",
        type: "Attelé – 2550m",
        top5: [
          { num: 13, name: "COOL KRONOS", strength: 92 },
          { num: 6,  name: "JUGEMENT D'AVE", strength: 88 },
          { num: 4,  name: "IROCKO STRYCK", strength: 82 },
          { num: 10, name: "KLASSE DE BRUZEAU", strength: 78 },
          { num: 2,  name: "FEROX BRICK", strength: 74 }
        ],
        base: { num: 13, name: "COOL KRONOS" },
        surprise: { num: 4, name: "IROCKO STRYCK" },
        combo5: [13, 6, 4, 10, 2],
        combo8: [13, 6, 4, 10, 2, 12, 14, 9]
      },
      {
        id: "R1C2",
        name: "Prix «La Dépêche du Midi»",
        type: "Attelé",
        // من ZEturf: 7 JUPITER PLANCHETTE, 8 INSTANT G, 11 GARD...
        top5: [
          { num: 7, name: "JUPITER PLANCHETTE", strength: 90 },
          { num: 8, name: "INSTANT GRIFF", strength: 86 },
          { num: 11, name: "GARD", strength: 80 },
          { num: 1, name: "HARDI DE LOU", strength: 75 },
          { num: 5, name: "HARLEM DU RIB", strength: 70 }
        ],
        base: { num: 7, name: "JUPITER PLANCHETTE" },
        surprise: { num: 11, name: "GARD" },
        combo5: [7, 8, 11, 1, 5],
        combo8: [7, 8, 11, 1, 5, 10, 12, 6]
      },
      {
        id: "R1C3",
        name: "Prix de l'Hippodrome d'Agen-Le Passge",
        type: "Attelé",
        // ZEturf: 4 NIAOULI DE WALLIS كـ favori
        top5: [
          { num: 4, name: "NIAOULI DE WALLIS", strength: 91 },
          { num: 8, name: "NOBLE ATOUT", strength: 84 },
          { num: 9, name: "NEW LOOK SENOVRE", strength: 79 },
          { num: 3, name: "NICE GUY", strength: 74 },
          { num: 12, name: "NINO DU GOUTIER", strength: 69 }
        ],
        base: { num: 4, name: "NIAOULI DE WALLIS" },
        surprise: { num: 9, name: "NEW LOOK SENOVRE" },
        combo5: [4, 8, 9, 3, 12],
        combo8: [4, 8, 9, 3, 12, 1, 6, 10]
      },
      {
        id: "R1C4",
        name: "Prix de l'Hippodrome de Bordeaux-Le Bouscat",
        type: "Attelé",
        // ZEturf: 6 MUSE DU VIVIER, 7 MAYA DU POM, 8 MAGIQUE R...
        top5: [
          { num: 6, name: "MUSE DU VIVIER", strength: 89 },
          { num: 7, name: "MAYA DU POMMEAU", strength: 85 },
          { num: 8, name: "MAGIQUE REVE", strength: 81 },
          { num: 1, name: "MAESTRO", strength: 75 },
          { num: 11, name: "MIDNIGHT MAGIC", strength: 70 }
        ],
        base: { num: 6, name: "MUSE DU VIVIER" },
        surprise: { num: 8, name: "MAGIQUE REVE" },
        combo5: [6, 7, 8, 1, 11],
        combo8: [6, 7, 8, 1, 11, 3, 5, 10]
      },
      {
        id: "R1C5",
        name: "Prix Chambre des Experts Comptables du 82",
        type: "Attelé",
        // ZEturf: 9 LUCKY LU, 8 LYSA, 16 LUKE SKYWALKER...
        top5: [
          { num: 9, name: "LUCKY LU", strength: 90 },
          { num: 8, name: "LYSA", strength: 86 },
          { num: 16, name: "LUKE SKYWALKER", strength: 82 },
          { num: 5, name: "LOVE YOU", strength: 76 },
          { num: 12, name: "LADY JANE", strength: 71 }
        ],
        base: { num: 9, name: "LUCKY LU" },
        surprise: { num: 16, name: "LUKE SKYWALKER" },
        combo5: [9, 8, 16, 5, 12],
        combo8: [9, 8, 16, 5, 12, 1, 3, 10]
      },
      {
        id: "R1C6",
        name: "Prix de l'Hippodrome de Borde-Vieille",
        type: "Attelé",
        // ZEturf: 6 JAMAIS, 11 JALTO DU TREMONT, 8 HASHTAG...
        top5: [
          { num: 6, name: "JAMAIS", strength: 91 },
          { num: 11, name: "JALTO DU TREMONT", strength: 87 },
          { num: 8, name: "HASHTAG DE TAGOR", strength: 82 },
          { num: 4, name: "IVRE DE TOI", strength: 76 },
          { num: 1, name: "HALFAN SPEED", strength: 71 }
        ],
        base: { num: 6, name: "JAMAIS" },
        surprise: { num: 11, name: "JALTO DU TREMONT" },
        combo5: [6, 11, 8, 4, 1],
        combo8: [6, 11, 8, 4, 1, 12, 2, 10]
      }
    ];

    function renderRaces() {
      const app = document.getElementById("app");
      app.innerHTML = "";

      races.forEach((race, idx) => {
        const card = document.createElement("div");
        card.className = "race-card";
        if (idx === 0) card.classList.add("open"); // افتح أول سباق تلقائيًا

        const header = document.createElement("div");
        header.className = "race-header";
        header.innerHTML = `
          <div>
            <div class="race-title">${race.id} – ${race.name}</div>
            <div class="race-sub">${race.type}</div>
          </div>
          <div style="font-size:1.1rem;">▾</div>
        `;
        header.addEventListener("click", () => {
          const isOpen = card.classList.contains("open");
          document.querySelectorAll(".race-card").forEach(c => c.classList.remove("open"));
          if (!isOpen) card.classList.add("open");
        });

        const body = document.createElement("div");
        body.className = "race-body";

        // Top 5
        let top5Html = '<div class="section-title">Top 5 ZEturf Pronos</div><ul class="top5-list">';
        race.top5.forEach((h, i) => {
          top5Html += `
            <li class="top5-item">
              <span class="rank">${h.num}</span>
              <div>
                <div class="horse-name">${h.name}</div>
                <div class="horse-meta">ترتيب ZEturf تقريبى</div>
              </div>
              <div class="strength">${h.strength}%</div>
            </li>
          `;
        });
        top5Html += "</ul>";

        // Base & Surprise
        const baseSurpriseHtml = `
          <div class="base-surprise">
            <div class="box base">
              <strong>الحصان الآمن (Base)</strong>
              <div class="value">${race.base.num} – ${race.base.name}</div>
            </div>
            <div class="box surprise">
              <strong>الحصان المفاجأة (Surprise)</strong>
              <div class="value">${race.surprise.num} – ${race.surprise.name}</div>
            </div>
          </div>
        `;

        // Combos
        const comboHtml = `
          <div class="combo-title">التركيبة المقترحة (5 خيول)</div>
          <ul class="combo-list">
            <li>${race.combo5.join(" – ")}</li>
          </ul>
          <div class="combo-title">التركيبة المقترحة (8 خيول)</div>
          <ul class="combo-list">
            <li>${race.combo8.join(" – ")}</li>
          </ul>
        `;

        body.innerHTML = top5Html + baseSurpriseHtml + comboHtml;
        card.appendChild(header);
        card.appendChild(body);
        app.appendChild(card);
      });
    }

    renderRaces();
  </script>
</body>
</
