<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Turf Pronostics - بيانات Quinté+ الحية</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; text-align: center; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #d32f2f; }
        .race-info { background: #e3f2fd; padding: 15px; border-radius: 5px; margin-bottom: 20px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #333; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .odds { font-weight: bold; color: #2e7d32; }
        .loading { font-size: 18px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h1>Zen Turf Pronostics - سباق Quinté+ اليوم</h1>
    <div id="race-details" class="race-info">جاري تحميل معلومات السباق...</div>
    
    <div id="loading-text" class="loading">جاري جلب قائمة الخيول والبيانات الحية من PMU...</div>
    
    <table id="horses-table" style="display: none;">
        <thead>
            <tr>
                <th>الرقم (N°)</th>
                <th>اسم الحصان (Cheval)</th>
                <th>الراكب/الفارس (Jockey)</th>
                <th>الاحتمال الحي (Odds)</th>
            </tr>
        </thead>
        <tbody id="horses-list">
            <!-- سيتم إدراج الخيول هنا أوتوماتيكياً -->
        </tbody>
    </table>
</div>

<script>
// تحديد تاريخ اليوم بصيغة (DDMMYYYY) لطلبات الـ API
const today = new Date();
const dd = String(today.getDate()).padStart(2, '0');
const mm = String(today.getMonth() + 1).padStart(2, '0');
const yyyy = today.getFullYear();
const formattedDate = `${dd}${mm}${yyyy}`;

// روابط الـ API المباشرة والمفتوحة من موقع PMU للسباقات والـ Odds
const pmuRacesUrl = `https://pmu.fr{formattedDate}`;

async function fetchQuinteData() {
    try {
        // 1. جلب برنامج السباقات اليومي بالكامل
        const response = await fetch(pmuRacesUrl);
        const data = await response.json();
        
        // 2. البحث عن السباق المخصص لـ Quinté+ (غالباً يُرمز له بـ eQuintePlus أو يكون متضمناً للخاصية)
        let quinteRace = null;
        let reunionNum = null;
        let raceNum = null;

        for (const reunion of data.reunions) {
            for (const race of reunion.courses) {
                // الفلترة بناءً على نوع الرهان المتاح للسباق وهو Quinté+
                if (race.paris && race.paris.includes('E_QUINTE_PLUS')) {
                    quinteRace = race;
                    reunionNum = reunion.numOfficiel;
                    raceNum = race.numOfficiel;
                    break;
                }
            }
            if (quinteRace) break;
        }

        // إذا لم يبدأ تصنيف رهان الكوينتي لليوم بعد، نأخذ أول سباق رئيسي كمثال
        if (!quinteRace) {
            quinteRace = data.reunions[0].courses[0];
            reunionNum = data.reunions[0].numOfficiel;
            raceNum = quinteRace.numOfficiel;
        }

        // عرض تفاصيل السباق الرئيسي
        document.getElementById('race-details').innerHTML = `
            المضمار (Réunion): R${reunionNum} | السباق (Course): C${raceNum} <br>
            اسم الجائزة: ${quinteRace.libelle} | المسافة: ${quinteRace.distance} متر
        `;

        // 3. جلب الاحتمالات الحية (Live Odds) الخاصة بهذا السباق بالتحديد
        const oddsUrl = `https://pmu.fr{formattedDate}/R${reunionNum}/C${raceNum}/rapports-probables/direct?combinaison=1`;
        const oddsResponse = await fetch(oddsUrl);
        const oddsData = await oddsResponse.json();
        
        // ربط قائمة الخيول (Participants) مع احتمالاتها الحية
        const participants = quinteRace.participants;
        const liveOddsList = oddsData.rapportsProbables || [];

        const tableBody = document.getElementById('horses-list');
        tableBody.html = ""; // تنظيف الجدول

        participants.forEach(horse => {
            // البحث عن الاحتمال الحي المقابل لرقم الحصان
            const horseOddsObj = liveOddsList.find(o => o.numNouveauParticipant === horse.numPmu);
            const liveOdds = horseOddsObj ? horseOddsObj.rapport : '-';

            const row = `<tr>
                <td><strong>${horse.numPmu}</strong></td>
                <td>${horse.nom}</td>
                <td>${horse.driver}</td>
                <td class="odds">${liveOdds}</td>
            </tr>`;
            tableBody.innerHTML += row;
        });

        // إخفاء رسالة التحميل وعرض الجدول
        document.getElementById('loading-text').style.display = 'none';
        document.getElementById('horses-table').style.display = 'table';

    } catch (error) {
        console.error("خطأ في جلب البيانات:", error);
        document.getElementById('loading-text').innerText = "فشل في تحديث البيانات الحية تلقائياً. تأكد من توفر السباقات الحالية.";
    }
}

// تشغيل الدالة فور تحميل الصفحة
fetchQuinteData();

// تحديث تلقائي للبيانات كل 60 ثانية (لجلب التغيرات في الـ Odds)
setInterval(fetchQuinteData, 60000);
</script>

</body>
